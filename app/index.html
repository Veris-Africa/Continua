<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Continua — Track NSE Stocks, Portfolio & TradersHub</title>
    <meta name="description" content="Research NSE companies, track your portfolio, set alerts and join TradersHub. Explore dated market data and company filings with Continua Engine." />
    <meta name="author" content="Continua" />
    <meta name="keywords" content="NSE Kenya, Nairobi Securities Exchange, Safaricom share price, Equity Bank, KCB share price, Kenyan stocks app, portfolio tracker Kenya, TradersHub" />
    <meta name="theme-color" content="#6C4FE0" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Continua — Kenyan Stocks, Portfolio & Social Investing" />
    <meta property="og:description" content="NSE company research, portfolio tracking and a Kenyan investor community. Check source dates and coverage in the app." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://continua-cypskip-creates-projects.vercel.app/landing" />
    <meta property="og:site_name" content="Continua" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Continua — Kenyan Stocks & TradersHub" />
    <meta name="twitter:description" content="NSE research, portfolio tracking and market conversations for Kenya." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Continua",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Track Kenyan NSE stocks, manage portfolios, set price alerts and join TradersHub.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KES" },
        "audience": { "@type": "Audience", "geographicArea": { "@type": "Country", "name": "Kenya" } }
      }
    </script>
  </head>

  <body>
    <style>
      .continua-boot{box-sizing:border-box;min-height:100dvh;margin:auto;padding:28px 20px 100px;max-width:720px;font:16px system-ui,sans-serif;color:#24222b;background:#faf9fd}.continua-boot header{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650}.continua-boot i{display:block;background:#ece9f3;border-radius:14px}.continua-boot header i{width:40px;height:40px;background:#6c4fe0}.continua-boot section{margin-top:28px}.continua-boot section i:first-child{height:180px;background:linear-gradient(0deg,#f4f1f8,transparent);border-radius:0}.continua-boot section i+ i{height:60px;margin-top:18px}.continua-boot p{font-size:14px;color:#625e70}body{margin:0}
    </style>
    <div id="root"><main class="continua-boot" role="status" aria-label="Opening Continua"><header><i aria-hidden="true"></i>Continua</header><p style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Connecting securely…</p><section aria-hidden="true"><i></i><i></i><i></i></section></main></div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
